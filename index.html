<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream - Simplistic Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Clean Google Font -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search song, artist, album...">
            <button id="searchBtn" onclick="searchTracks()">Search</button>
        </div>

        <!-- Main Wrapper Split Layout -->
        <div class="main-layout">
            
            <!-- Left Side: Modern Interactive Player Box -->
            <div class="player-panel">
                <div class="art-wrapper">
                    <img id="albumArt" src="https://unsplash.com" alt="Album Cover">
                </div>
                <div class="track-details">
                    <h2 id="playerTitle">No Track Selected</h2>
                    <p id="playerArtist">Search and choose a song to start</p>
                </div>

                <!-- Hidden Native Audio Engine -->
                <audio id="audioEngine"></audio>

                <!-- Custom Scannable Timeline -->
                <div class="timeline-container">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="progressBar" value="0" min="0" max="100" oninput="seekAudio()">
                    <span id="durationTime">0:00</span>
                </div>

                <!-- Interactive Media Controls -->
                <div class="controls">
                    <button id="playPauseBtn" class="play-btn" onclick="togglePlayback()" disabled>Play</button>
                </div>
            </div>

            <!-- Right Side: Scrollable Track Grid Results -->
            <div class="results-panel">
                <div id="resultsList" class="results-list">
                    <p class="empty-state">Your search items will appear here.</p>
                </div>
            </div>

        </div>
    </div>

    <script href="app.js" src="app.js"></script>
</body>
</html>
