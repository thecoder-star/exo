<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Music App</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        input { padding: 10px; width: 60%; border-radius: 5px; border: none; font-size: 16px; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background: #1db954; color: white; font-weight: bold; cursor: pointer; }
        #results { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        .track { background: #1c1c1c; padding: 12px; margin: 5px; width: 70%; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; }
        .track:hover { background: #282828; }
        audio { margin-top: 30px; width: 70%; }
    </style>
</head>
<body>

    <h1>🎵 My Personal Music Streamer</h1>
    <input type="text" id="query" placeholder="Search for a song or artist...">
    <button onclick="searchMusic()">Search</button>

    <div id="results"></div>
    <audio id="audioPlayer" controls></audio>

    <script src="app.js"></script>
</body>
</html>
